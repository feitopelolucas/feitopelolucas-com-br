# Publica o site no GitHub Pages a cada push na main.
# Só vai para o ar o que está em feitopelolucas/public, menos o index.php.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separar os arquivos do site
        run: |
          mkdir _site
          cp -r feitopelolucas/public/. _site/
          rm -f _site/index.php _site/.assetsignore
          touch _site/.nojekyll

      # Toda página precisa da camada de proteção (Content-Security-Policy).
      # Se alguma ficar sem, a publicação para aqui e mostra qual é.
      - name: Conferir a proteção das páginas
        run: |
          faltando=$(grep -rL 'http-equiv="Content-Security-Policy"' --include='*.html' _site || true)
          if [ -n "$faltando" ]; then
            echo "Páginas sem a meta Content-Security-Policy:"
            echo "$faltando"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
